<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paisaje de montaña — Día / Noche</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">
    <div class="scene-card">
        <svg class="scene" id="scene" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Paisaje de montañas en atardecer, transformable a escena nocturna">
            <defs id="sceneDefs">
                <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop class="sky-stop sky-stop-1" offset="0%"/>
                    <stop class="sky-stop sky-stop-2" offset="40%"/>
                    <stop class="sky-stop sky-stop-3" offset="72%"/>
                    <stop class="sky-stop sky-stop-4" offset="100%"/>
                </linearGradient>

                <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fff3c4" stop-opacity="0.9"/>
                    <stop offset="35%" stop-color="#ffb454" stop-opacity="0.55"/>
                    <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.85"/>
                    <stop offset="35%" stop-color="#c77dff" stop-opacity="0.45"/>
                    <stop offset="100%" stop-color="#c77dff" stop-opacity="0"/>
                </radialGradient>

                <radialGradient id="sunBody" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#fffaeb"/>
                    <stop offset="55%" stop-color="#ffd166"/>
                    <stop offset="100%" stop-color="#ff9a56"/>
                </radialGradient>

                <radialGradient id="moonBody" cx="35%" cy="32%" r="70%">
                    <stop offset="0%" stop-color="#fdfbff"/>
                    <stop offset="60%" stop-color="#e4defb"/>
                    <stop offset="100%" stop-color="#c9c0e8"/>
                </radialGradient>

                <filter id="hazeBlur" x="-10%" y="-30%" width="120%" height="160%">
                    <feGaussianBlur stdDeviation="3.2"/>
                </filter>
            </defs>

            <rect class="sky" x="0" y="0" width="1200" height="600" fill="url(#skyGradient)"/>

            <g class="stars" id="stars" aria-hidden="true"></g>

            <g class="clouds" aria-hidden="true">
                <path class="cloud cloud-1" d="M120,150 q30,-28 65,-10 q20,-22 50,-6 q28,-14 46,8 q22,4 14,22 q6,16 -14,18 l-150,4 q-24,-2 -18,-18 q-8,-12 7,-18 Z"/>
                <path class="cloud cloud-2" d="M780,110 q26,-24 56,-8 q18,-18 44,-4 q24,-12 40,8 q18,4 12,18 q6,14 -12,16 l-130,3 q-20,-2 -16,-16 q-6,-10 6,-17 Z"/>
                <path class="cloud cloud-3" d="M900,220 q22,-18 46,-6 q14,-14 34,-3 q18,-10 30,6 q14,3 9,14 q5,11 -9,13 l-104,3 q-16,-2 -13,-13 q-5,-8 7,-14 Z"/>
            </g>

            <g class="haze-layer" filter="url(#hazeBlur)">
                <path class="mountain mountain-far" id="mountainFar"/>
                <g class="snow-caps-far" id="snowCapsFar" aria-hidden="true"></g>
            </g>

            <g class="celestial" transform="translate(600,350)" aria-hidden="true">
                <circle class="celestial-glow celestial-glow-sun" r="150" fill="url(#sunGlow)"/>
                <circle class="celestial-glow celestial-glow-moon" r="120" fill="url(#moonGlow)"/>
                <circle class="celestial-body celestial-sun" r="70" fill="url(#sunBody)"/>
                <g class="celestial-body celestial-moon">
                    <circle r="55" fill="url(#moonBody)"/>
                    <circle class="crater" cx="-18" cy="-14" r="11"/>
                    <circle class="crater" cx="20" cy="10" r="8"/>
                    <circle class="crater" cx="2" cy="-28" r="5.5"/>
                    <circle class="crater" cx="-8" cy="24" r="6.5"/>
                </g>
            </g>

            <path class="mountain mountain-mid" id="mountainMid"/>

            <g class="snow-caps-mid" id="snowCapsMid" aria-hidden="true"></g>

            <path class="mountain mountain-near" id="mountainNear"/>

            <g class="pines" id="pines" aria-hidden="true"></g>
        </svg>

        <button class="toggle-btn" id="toggleBtn" type="button" aria-pressed="false">
            <span class="toggle-icon" aria-hidden="true">🌙</span>
            <span class="toggle-label">Noche</span>
        </button>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
